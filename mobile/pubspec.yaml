name: learnova
description: "Learn. Connect. Experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  video_player: ^2.8.2
  path_provider: ^2.1.2
  flutter_pdfview: ^1.3.1
  url_launcher: ^6.2.4
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  badges: ^3.1.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
