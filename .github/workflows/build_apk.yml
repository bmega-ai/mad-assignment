name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android Gradle Wrapper & Platform Files
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation -v 2>&1 | tee ../build.log

      - name: Report Error Annotations on Failure
        if: failure()
        run: |
          python3 -c "
          with open('build.log', 'r', errors='ignore') as f:
              lines = f.read().splitlines()

          for i, l in enumerate(lines):
              if '* What went wrong:' in l:
                  msg = '%0A'.join(lines[i:min(len(lines), i+35)])
                  print(f'::error title=WhatWentWrong::{msg}')
                  break

          for i, l in enumerate(lines):
              if 'Caused by:' in l:
                  msg = '%0A'.join(lines[i:min(len(lines), i+20)])
                  print(f'::error title=CausedBy::{msg}')
                  break

          for i, l in enumerate(lines):
              if 'Error:' in l and 'DependencyValidation' not in l:
                  msg = '%0A'.join(lines[i:min(len(lines), i+15)])
                  print(f'::error title=ErrorLine::{msg}')
                  break
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
