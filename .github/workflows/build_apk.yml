name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android Gradle Wrapper & Platform Files
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org com.learnova --project-name learnova --android-language java
          rm -rf android/app/src/main/java/com/learnova/mobile

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation -v 2>&1 | tee ../build.log

      - name: Report Error Annotations on Failure
        if: always()
        run: |
          python3 -c "
          import os
          if not os.path.exists('build.log'):
              print('No build.log found.')
              exit(0)

          with open('build.log', 'r', errors='ignore') as f:
              lines = f.read().splitlines()

          # 1. Capture Kotlin/Java compiler errors
          compile_errors = [l for l in lines if l.strip().startswith('e:') or ': error:' in l or 'e: /' in l]
          if compile_errors:
              msg = '%0A'.join(compile_errors[:20])
              print(f'::error title=CompilerErrors::{msg}')

          # 2. Capture context around compile task failure
          for i, l in enumerate(lines):
              if ':app:compile' in l and 'FAILED' in l:
                  start = max(0, i - 30)
                  end = min(len(lines), i + 10)
                  msg = '%0A'.join(lines[start:end])
                  print(f'::error title=CompileTaskFailure::{msg}')
                  break

          # 3. Capture Gradle What went wrong
          for i, l in enumerate(lines):
              if '* What went wrong:' in l:
                  msg = '%0A'.join(lines[i:min(len(lines), i+35)])
                  print(f'::error title=WhatWentWrong::{msg}')
                  break

          # 4. Capture Caused by
          for i, l in enumerate(lines):
              if 'Caused by:' in l:
                  msg = '%0A'.join(lines[i:min(len(lines), i+20)])
                  print(f'::error title=CausedBy::{msg}')
                  break
          "

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

