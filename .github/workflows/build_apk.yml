name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android Gradle Wrapper & Platform Files
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation -v 2>&1 | tee ../build.log

      - name: Upload Full Error Log on Failure
        if: failure()
        run: |
          python3 -c "
          import urllib.request
          try:
              with open('build.log', 'r', errors='ignore') as f:
                  text = f.read()
              req = urllib.request.Request('https://paste.rs', data=text.encode('utf-8'), method='POST')
              with urllib.request.urlopen(req) as resp:
                  url = resp.read().decode('utf-8').strip()
                  print(f'::error title=FullLogURL::Complete build log: {url}')
              lines = text.splitlines()
              for i, l in enumerate(lines):
                  if 'What went wrong:' in l or 'FAILURE: Build failed' in l:
                      msg = '%0A'.join(lines[i:i+20])
                      print(f'::error title=WhatWentWrong::{msg}')
                      break
          except Exception as e:
              print(f'::error title=LogUploadFailed::{e}')
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
