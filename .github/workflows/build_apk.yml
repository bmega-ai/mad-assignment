name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android Gradle Wrapper & Platform Files
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee ../build.log

      - name: Print error summary on failure
        if: failure()
        run: |
          echo "## Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
