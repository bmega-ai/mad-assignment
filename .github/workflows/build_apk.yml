name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android Gradle Wrapper & Platform Files
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee ../build.log

      - name: Print error annotations
        if: failure()
        run: |
          grep -i -E "(error:|failure|exception|what went wrong)" ../build.log | head -n 15 | while read -r line; do
            echo "::error::$line"
          done

      - name: Push build log to branch on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B build-logs
          git add -f ../build.log
          git commit -m "Upload build failure log" || true
          git push -f origin build-logs || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
